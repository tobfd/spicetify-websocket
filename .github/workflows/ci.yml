name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  # The end-to-end job tests against the extension's default branch, which can
  # change without a commit here. Run weekly to catch protocol drift.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      extension_ref:
        description: "spicetify-connect-api branch, tag or commit for the end-to-end tests"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linting
        run: ruff check --no-fix .

      - name: Run Ruff Format Check
        run: ruff format --check .

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: pytest

  test-latest-deps:
    name: Pytest (newest allowed dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install newest allowed dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -e . pytest pytest-asyncio pytest-cov
          pip list | grep -iE "websockets|pydantic"

      - name: Run Pytest
        run: pytest

  e2e:
    name: End-to-end with spicetify-connect-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out spicetify-connect-api
        uses: actions/checkout@v4
        with:
          repository: tobfd/spicetify-connect-api
          # Manual input, then the repository variable SPICETIFY_EXTENSION_REF, then master.
          ref: ${{ inputs.extension_ref || vars.SPICETIFY_EXTENSION_REF || 'master' }}
          path: spicetify-connect-api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run end-to-end tests
        env:
          SPICETIFY_EXTENSION_DIR: spicetify-connect-api
        run: pytest tests/e2e -v -rs --no-cov

