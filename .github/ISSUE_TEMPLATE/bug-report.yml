name: Bug Report
description: Report a bug that you found
labels: [bug]
type: Bug

body:
- type: markdown
  attributes:
    value: |
      - Check if the bug was already reported.
      - Include only one bug per issue.

- type: input
  attributes:
    label: spicetify-websocket Version
    description: Which version of spicetify-websocket are you using? Check the version with ``pip freeze`` and check ``spicetify-websocket==VERSION``.
    placeholder: X.Y.Z
  validations:
    required: true

- type: textarea
  attributes:
    label: Bug Description
    description: Please provide a brief summary of the bug.
  validations:
    required: true

- type: textarea
  attributes:
    label: Reproduction Steps
    description: Write down the steps to reproduce the bug.
  validations:
    required: true

- type: textarea
  attributes:
    label: Minimal Reproducible Code
    description: >
      A short snippet of code that showcases the bug.
      Please remove your API token and everything that is not related to the bug.
    render: Python

- type: textarea
  attributes:
    label: Expected Results
    description: What did you expect to happen?
  validations:
    required: true

- type: textarea
  attributes:
    label: Actual Results
    description: What actually happened?
  validations:
    required: true

- type: textarea
  attributes:
    label: error traceback
    description: If the bug caused an error, please provide the full traceback.
  validations:
    required: false
